name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - if: runner.os == 'macOS'
        run: npm run package:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: npm run package:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Scripture-Projector-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
